[package]
categories = ["gui", "wasm", "web-programming"]
description = "Realtime pub/sub communication for Leptos + Axum applications."
edition = "2024"
exclude = ["examples/", "tests/"]
keywords = ["communication", "leptos", "pubsub", "websocket"]
license = "MIT OR Apache-2.0"
name = "leptos-axum-socket"
readme = "README.md"
repository = "https://github.com/Synphonyte/leptos-axum-socket"
version = "0.8.0"

[package.metadata.docs.rs]
features = ["ssr"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", optional = true, features = ["macros", "ws"] }
cookie = { version = "0.18", optional = true }
futures-util = { version = "0.3", optional = true }
leptos = { version = "0.8.19" }
leptos-use-core = "0.20"
leptos-use-header = { version = "0.20", optional = true, features = ["axum"] }
leptos-use-websocket = "0.20"
leptos_axum = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
], optional = true }
tokio-util = { version = "0.7", optional = true }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }

# The doc tests are written against the server-side API, so they only compile
# with the `ssr` feature. Features requested by dev-dependencies are enabled for
# test builds only, which is what lets plain `cargo test` and
# `cargo clippy --tests` work without passing `--features ssr` explicitly while
# leaving normal builds and downstream users of this crate untouched.
[dev-dependencies]
leptos-axum-socket = { path = ".", features = ["ssr"] }

[features]
hydrate = ["leptos/hydrate", "uuid/js"]
ssr = [
    "dep:axum",
    "dep:cookie",
    "dep:futures-util",
    "dep:leptos_axum",
    "dep:leptos-use-header",
    "dep:tokio",
    "dep:tokio-util",
    "leptos-use-core/ssr",
    "leptos-use-header/ssr",
    "leptos-use-websocket/ssr",
    "leptos/ssr",
]
